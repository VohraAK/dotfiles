add_newline = false

# Prevent visual hanging on deep directories / slow commands
command_timeout = 1000
scan_timeout = 10

format = """$time$hostname$directory$git_branch$git_status $character"""

[time]
disabled = false
time_format = "%H:%M"
format = "[\\[$time\\]]($style) "
style = "dimmed white"

[hostname]
ssh_only = false
format = "[$hostname]($style)[:](dimmed white)"
style = "dimmed white"

[directory]
format = "[$path]($style)"
style = "bold yellow"
truncation_length = 1
truncate_to_repo = false

[git_branch]
format = " [$branch]($style)"
style = "bold #FCF392"

[git_status]
format = "([$all_status]($style))"
style = "bold #FCF392"
ignore_submodules = true
conflicted = ""
modified = ""
untracked = ""
staged = ""

[character]
success_symbol = "[|](bold green)"
error_symbol = "[|](bold red)"

# Disable expensive global version checks
[python]
detect_extensions = []

[nodejs]
detect_extensions = []

[rust]
detect_extensions = []

[golang]
detect_extensions = []

[php]
detect_extensions = []